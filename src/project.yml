name: HGhub
options:
  bundleIdPrefix: com.hghub
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      ONLY_ACTIVE_ARCH: YES
      DEBUG_INFORMATION_FORMAT: dwarf
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ALWAYS_SEARCH_USER_PATHS: NO
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  HGhub:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HGhub
    settings:
      base:
        PRODUCT_NAME: HGhub
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        PRODUCT_BUNDLE_IDENTIFIER: com.hghub.native
        INFOPLIST_FILE: HGhub/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS: HGhub/Resources/HGhub.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
  HGhubTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: HGhubTests
    dependencies:
      - target: HGhub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hghub.native.tests
        SDKROOT: auto
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator macosx"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: HGhubTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HGhub.app/HGhub"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/HGhub.app/Contents/MacOS/HGhub"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HGhub:
    build:
      targets:
        HGhub: all
        HGhubTests: [test]
    test:
      targets: [HGhubTests]
